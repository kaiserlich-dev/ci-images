name: Build CI Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  ruby:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        ruby: ["3.3.5", "3.4.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ruby
          push: true
          build-args: RUBY_VERSION=${{ matrix.ruby }}
          tags: |
            ${{ env.REGISTRY }}/kaiserlich-dev/ci-images/ruby:${{ matrix.ruby }}

  node:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: node
          push: true
          build-args: NODE_VERSION=${{ matrix.node }}
          tags: |
            ${{ env.REGISTRY }}/kaiserlich-dev/ci-images/node:${{ matrix.node }}
